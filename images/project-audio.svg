  <text x="35" y="354" fill="#64748b" font-size="8">[00:12]</text><text x="70" y="354" fill="#ede9fe" font-size="8">Can you walk me through how you would design a scalable API?</text>
  <text x="35" y="370" fill="#64748b" font-size="8">[00:19]</text><text x="70" y="370" fill="#6b5fa0" font-size="8">Sure. I'd start with a microservices approach using FastAPI...</text>
  <text x="35" y="390" fill="#64748b" font-size="8">[00:27]</text><text x="70" y="390" fill="#6b5fa0" font-size="8">With async endpoints handling concurrent audio streams efficiently.</text>
